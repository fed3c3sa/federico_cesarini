<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";font-weight:100 900;src:url("../assets/fonts/inter-var.woff2") format("woff2")}
html,body{margin:0;width:1200px;height:630px;background:#0f1113;overflow:hidden;font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px}
.brainbox{position:absolute;right:0;top:-10px;width:640px;height:650px}
.brainbox canvas{position:absolute;inset:0;width:100%;height:100%}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0f1113 0%,#0f1113 38%,rgba(15,17,19,.55) 58%,rgba(15,17,19,0) 78%)}
.text{position:absolute;left:84px;top:0;bottom:0;width:660px;display:flex;flex-direction:column;justify-content:center}
.avatar{width:100px;height:100px;border-radius:50%;border:1px solid #2b2d30;box-shadow:0 18px 50px rgba(0,0,0,.5)}
h1{margin:30px 0 0;font-size:70px;line-height:1;font-weight:600;letter-spacing:-.035em;color:#fff}
.claim{margin:20px 0 0;font-size:31px;line-height:1.25;font-weight:500;letter-spacing:-.018em;color:#8e939a}
.claim b{font-weight:500;color:#fff}
.roles{margin:22px 0 0;font-size:19px;color:#b7bbc1}
.roles i{font-style:normal;color:#62676e;padding:0 8px}
.url{margin:36px 0 0;font-size:18px;font-weight:500;color:#4a8bff}
</style></head>
<body><div class="card">
  <div class="brainbox"><canvas data-brain data-dense data-seed="11"></canvas></div>
  <div class="fade"></div>
  <div class="text">
    <img class="avatar" src="../1742824917112.jpeg" alt="">
    <h1>Federico Cesarini</h1>
    <p class="claim"><b>I build memory systems</b><br>for agents, and humans.</p>
    <p class="roles">AI Engineer &amp; Consultant<i>·</i>Solo Founder, SecondBrain<i>·</i>CROW</p>
    <p class="url">federicocesarini.com</p>
  </div>
</div>
<script src="../assets/brain.js"></script>
</body></html>
